[project]
name = "nokia-gnmi-mcp"
version = "2.0.0"
description = "MCP server for Nokia SR OS gNMI management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pygnmi>=0.8.14",
    "jsonschema>=4.20,<5",
]

[project.scripts]
nokia-gnmi-mcp = "nokia_gnmi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
