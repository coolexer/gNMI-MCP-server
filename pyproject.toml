[project]
name = "nokia-gnmi-mcp"
version = "1.1.0"
description = "FastMCP server for Nokia SR OS gNMI operations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "fastmcp>=3.3.1",
    "pygnmi>=0.8.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
nokia-gnmi-mcp = "nokia_gnmi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
